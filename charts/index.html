<style>
  :root{--night:#1B1A2E;--night2:#26253D;--night3:#34334F;--lamp:#E8A33D;--stone:#F2E6CF;--mist:#A9A2BC;
    --kufi:"Reem Kufi","Alexandria",system-ui,sans-serif;--sans:"Alexandria","Segoe UI",Tahoma,system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--night);color:var(--stone);font-family:var(--sans);font-size:17px;line-height:1.8}
  a{color:var(--lamp);text-underline-offset:4px;overflow-wrap:anywhere}
  a:focus-visible{outline:2px solid var(--lamp);outline-offset:3px;border-radius:4px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  .mono{font-family:var(--mono);font-weight:500;direction:ltr;unicode-bidi:isolate}
  .bench-ico{display:block;flex:none}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding-block:14px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--kufi);font-weight:700;font-size:24px;line-height:1;color:var(--stone);text-decoration:none;min-height:44px}
  .brand .bench-ico{width:34px;height:26px}
  .back{color:var(--mist);text-decoration:none;font-size:15px;font-weight:500;padding-block:12px}
  .back:hover{color:var(--stone)}
  .page-hero{background:radial-gradient(70% 90% at 50% 0%,rgba(232,163,61,.13),rgba(232,163,61,0) 70%),var(--night);border-bottom:1px solid var(--night3)}
  .doc{max-width:760px;margin:0 auto;padding:0 20px 24px}
  .doc h1{font-weight:900;font-size:clamp(36px,8.6vw,54px);line-height:1.3;margin:28px 0 6px}
  .doc .updated{color:var(--mist);margin:0 0 30px;font-size:15px}
  .doc .ar{background:var(--night2);border:1px solid var(--night3);border-radius:20px;padding:22px 22px 12px;margin:0 0 8px;font-size:17.5px}
  .doc .ar p{margin:0 0 12px}
  .doc .en{direction:ltr;text-align:left;margin-top:40px;padding-top:6px}
  .doc .en h2{font-family:var(--sans);font-size:clamp(26px,5.4vw,34px);font-weight:800;letter-spacing:-.01em;line-height:1.25;margin:0 0 14px;padding-bottom:16px;border-bottom:1px solid var(--night3)}
  .doc .en h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp);margin:34px 0 6px;line-height:1.5}
  .doc .en p,.doc .en li{max-width:66ch;font-size:16.5px;line-height:1.75}
  .doc .en p{margin:0 0 12px}
  .doc .en ul{padding-left:0;margin:0 0 12px;list-style:none}
  .doc .en li{position:relative;padding-left:22px;margin-bottom:8px}
  .doc .en li::before{content:"";position:absolute;left:2px;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--lamp)}
  footer{border-top:1px solid var(--night3);margin-top:64px;padding:40px 0 48px;color:var(--mist);font-size:15px}
  .foot{display:flex;flex-direction:column;gap:22px}
  .foot-brand{display:flex;align-items:center;gap:12px}
  .foot-brand .bench-ico{width:40px;height:30px}
  .foot-brand .w{font-family:var(--kufi);font-weight:700;font-size:26px;color:var(--stone);line-height:1}
  .foot-brand .mono{color:var(--lamp);font-size:14px;margin-inline-start:4px}
  .foot nav{display:flex;flex-wrap:wrap;gap:4px 26px}
  .foot nav a{color:var(--stone);text-decoration:none;padding-block:10px}
  .foot nav a:hover,.foot nav a[aria-current]{color:var(--lamp)}
  .foot small{font-size:13.5px}
  @media (min-width:760px){.foot{flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap}}
  .doc .lead{font-size:19px;margin:0 0 8px}
  .doc h2{font-weight:800;font-size:clamp(22px,5vw,26px);line-height:1.4;margin:40px 0 10px}
  .doc h2::before{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--lamp);margin-bottom:14px}
  .doc p{margin:0 0 12px}
  .doc main-ul,.doc .list{padding:0;margin:0 0 12px;list-style:none}
  .doc .list li{position:relative;padding-inline-start:22px;margin-bottom:8px}
  .doc .list li::before{content:"";position:absolute;inset-inline-start:2px;top:.75em;width:7px;height:7px;border-radius:50%;background:var(--lamp)}
  .doc .box{background:var(--night2);border:1px solid var(--night3);border-radius:20px;padding:20px 22px 10px;margin:14px 0}
  .doc .rule{color:var(--lamp);font-weight:800}
  .doc .tags{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px;padding:0;list-style:none}
  .doc .tags li{background:var(--night2);border:1px solid var(--night3);border-radius:999px;padding:4px 14px}
  .doc .up{color:#7FD1B9}.doc .down{color:#EF8A74}
  .doc .cta{display:inline-block;background:var(--lamp);color:var(--night);font-weight:800;text-decoration:none;border-radius:999px;padding:12px 26px;min-height:44px}
  .doc .log li{color:var(--mist)} .doc .log b{color:var(--stone)}

  .doc.chart{max-width:820px}
  .chart-list{list-style:none;padding:0;margin:6px 0 0}
  .chart-list li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--night3)}
  .chart-list .rank{width:40px;flex:none;text-align:center;font-weight:900;font-size:26px;line-height:1}
  .chart-list .mv{width:56px;flex:none;text-align:center;font-weight:700;font-size:14px;color:var(--mist)}
  .chart-list .mv.up{color:var(--up)} .chart-list .mv.down{color:var(--down)} .chart-list .mv.new{color:var(--lamp)}
  .chart-list .pic{width:52px;height:52px;flex:none;border-radius:50%;object-fit:cover;background:var(--night2)}
  .chart-list .pic.wide{width:80px;height:45px;border-radius:8px}
  .chart-list .pic.none{display:inline-block}
  .chart-list .who{flex:1;min-width:0;line-height:1.5}
  .chart-list .who a{color:var(--stone);text-decoration:none;font-weight:700}
  .chart-list .who a:hover{color:var(--lamp)}
  .chart-list .sec{color:var(--mist);font-weight:400}
  .chart-list .wk{display:block;color:var(--mist);font-size:14px}
  .chart-list .ratio{flex:none;color:var(--up);font-weight:800}
  .doc .episode .t{font-weight:800;font-size:20px;color:var(--stone);text-decoration:none}
  .doc .episode .t:hover{color:var(--lamp)}
  .doc .method{margin-top:36px;color:var(--mist)}
  .pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--night3)}
  .pager a{text-decoration:none;font-weight:700;padding-block:8px}
  .banner{background:var(--lamp);color:var(--night);font-weight:800;text-align:center;padding:10px 16px}
  .charts-index{list-style:none;padding:0}
  .charts-index li{padding:14px 0;border-bottom:1px solid var(--night3)}
  .charts-index a{font-weight:800;text-decoration:none}
  .charts-index span{display:block;color:var(--mist);font-size:15px}
</style>
